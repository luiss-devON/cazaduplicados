[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cazaduplicados"
version = "1.0.0"
description = "Encuentra archivos duplicados por contenido y libera espacio de forma segura y reversible."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Luis Castro" }]
keywords = ["duplicados", "duplicate-finder", "cli", "limpieza", "almacenamiento"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
cazaduplicados = "cazaduplicados.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
